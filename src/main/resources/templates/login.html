<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" th:href="@{/images/icon.png}" type="image/png">
</head>
<body>

<div class="login-bg">
    <div class="login-card">

        <div class="login-header">
            <img th:src="@{/images/icon.png}" alt="logo" class="login-logo">
            <h2>Smart Recipe Finder</h2>
            <p>Discover meals from your kitchen</p>
        </div>

        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="error" th:text="${error}"></p>
        <p class="login-signup">Don't have an account? <a href="/register">Sign up</a></p>

    </div>
</div>

</body>
</html>
